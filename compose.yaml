name: estoque-dev

services:
  banco:
    image: postgres:18.6-alpine
    env_file: .env.docker
    volumes:
      - dados-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    image: controle-estoque-app:dev
    build:
      context: .
      target: dev
    env_file: .env.docker
    environment:
      POSTGRES_HOST: banco
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      DJANGO_DEBUG: "1"
      DJANGO_CARREGAR_DADOS_DEMO: "1"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"
    ports:
      - "127.0.0.1:${PORTA_DESENVOLVIMENTO:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./manage.py:/app/manage.py:ro
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dados-postgres:
